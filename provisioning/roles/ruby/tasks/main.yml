---
- name: Ensure curl is installed
  apt: pkg=curl

- name: "Install gpg key for rvm_users"
  shell: gpg --keyserver keyserver.ubuntu.com --recv-keys 409B6B1796C275462A1703113804BB82D39DC0E3 7D2BAF1CF37B13E2069D6956105BD0E739499BDB
  become_user: "{{ item }}"
  loop: "{{ rvm_users }}"

# TODO: Maybe install rvm by installing the package ruby-rvm?
- name: "Ensure rvm installed for rvm_users"
  shell: "curl -sSL https://get.rvm.io | bash -s stable creates=/home/{{ item }}/.rvm"
  become_user: "{{ item }}"
  loop: "{{ rvm_users }}"

# An old rvm keeps a stale ruby-build definition that can point at a source
# tarball extension the upstream mirror has since stopped publishing (e.g.
# ruby-lang.org dropping .tar.bz2 for a release while keeping .tar.gz/.tar.xz),
# making `rvm install` fail with a 404 that looks like the version itself is
# unavailable. Keeping rvm itself current avoids that.
#
# Deliberately NOT `rvm get stable`: that runs the *already-installed* rvm's
# own internal self-update, which on an old enough rvm still points at a dead
# bitbucket.org URL and silently does nothing (confirmed on production). The
# external installer below is a different code path (the current script
# served live from get.rvm.io, fetching from GitHub) and upgrades an existing
# install in place just as well as it performs a first install above.
- name: "Ensure rvm is up to date for rvm_users"
  shell: "curl -sSL https://get.rvm.io | bash -s stable"
  become_user: "{{ item }}"
  loop: "{{ rvm_users }}"
  # async can't be combined with check mode, so drop it there
  async: "{{ 0 if ansible_check_mode else 300 }}"
  poll: 5
  ignore_errors: yes

- name: "Ensure ruby dependencies are installed"
  apt:
    pkg:
      - autoconf
      - automake
      - bison
      - g++
      - gawk
      - libtool
      - make
      - patch
      - pkg-config

- name: "Ensure gem dependencies are installed"
  apt:
    pkg: "{{ apt_packages }}"

- name: "Install ruby-{{ ruby_version }} for rvm_users (with binary)"
  command: "/bin/bash -l -c 'rvm install ruby-{{ ruby_version }} --autolibs=read-fail'"
  args:
    creates: "/home/{{ item }}/.rvm/rubies/ruby-{{ ruby_version }}"
  become_user: "{{ item }}"
  loop: "{{ rvm_users }}"
  # async can't be combined with check mode, so drop it there
  async: "{{ 0 if ansible_check_mode else 300 }}"
  poll: 5
  register: rvm_install
  ignore_errors: yes
  notify: "Set default ruby version"

- name: "Install ruby-{{ ruby_version }} for rvm_users (fallback compile from source)"
  command: "/bin/bash -l -c 'rvm install ruby-{{ ruby_version }} --disable-binary --autolibs=read-fail'"
  args:
    creates: "/home/{{ item.item }}/.rvm/rubies/ruby-{{ ruby_version }}"
  become_user: "{{ item.item }}"
  loop: "{{ rvm_install.results }}"
  # async can't be combined with check mode, so drop it there
  async: "{{ 0 if ansible_check_mode else 1800 }}"
  poll: 5
  when: item.failed | default(false)
  notify: "Set default ruby version"

- name: Check if bundler is installed for rvm_users
  command: /bin/bash -lc "rvm ruby-{{ ruby_version }} do gem list bundler -i -v {{ bundler_version }}"
  become_user: "{{ item }}"
  register: bundler_check
  failed_when: false
  changed_when: false
  # Read-only, so run it even in check mode to give the next task a real rc
  check_mode: false
  loop: "{{ rvm_users }}"
  # Disable use of PTY as it sometimes hangs
  async: 60
  poll: 2

- name: Install bundler for ruby {{ ruby_version }} for rvm_users
  command: /bin/bash -lc "rvm ruby-{{ ruby_version }} do gem install bundler --version {{ bundler_version }}"
  become_user: "{{ item.item }}"
  when: item.rc != 0
  loop: "{{ bundler_check.results }}"
  # Disable use of PTY as it sometimes hangs (async dropped in check mode,
  # which can't be combined with it)
  async: "{{ 0 if ansible_check_mode else 300 }}"
  poll: 2

- name: Create .bash_aliases for rvm_users
  ansible.builtin.lineinfile:
    path: "/home/{{ item.0 }}/.bash_aliases"
    line: "{{ item.1 }}"
    create: yes
    owner: "{{ item.0 }}"
    group: "{{ item.0 }}"
    mode: '0644'
  tags: 'bash_aliases'
  loop: "{{ rvm_users | product(bash_alias_lines) | list }}"
