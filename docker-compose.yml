include:
  - docker_images/services.yaml

x-ruby-service: &ruby-service
  build:
    context: .
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
      DOCKER_GID: ${DOCKER_GID:-999}
  # Sorbet doesn't currently build for Linux ARM64 (see https://github.com/sorbet/sorbet/issues/4119)
  # So, we're forced to build the container as linux/amd64 always and lean on Rosetta
  # on Apple silicon for running this.
  # Important: if you're on Apple Silicon ensure that "Use Rosetta for x86/amd64 emulation on Apple Silicon"
  # is switched on in Docker Desktop.
  platform: linux/amd64
  volumes:
    - .:/app
    - gem_cache:/usr/local/bundle/gems
    - /var/run/docker.sock:/var/run/docker.sock
    # Capistrano (net-ssh) authenticates through the host's SSH agent, so
    # deploys run from the container without copying keys into it. Docker
    # Desktop bridges the host agent to this fixed path; on native Linux set
    # SSH_AGENT_SOCK=$SSH_AUTH_SOCK instead. The socket arrives root-owned, so
    # bin/docker-entrypoint hands it to deploy.
    #
    # Both SSH mounts turn create_host_path off, and so are spelled long-hand.
    # Docker's default is to invent a missing source as an empty *directory*,
    # which then mounts over the target and leaves ssh failing with no hint as
    # to why. Off, the daemon refuses to start and names the path it wanted,
    # which is the difference between "set SSH_AGENT_SOCK" and an afternoon.
    - type: bind
      source: ${SSH_AGENT_SOCK:-/run/host-services/ssh-auth.sock}
      target: /tmp/ssh-agent.sock
      bind:
        create_host_path: false
    # Without this net-ssh silently trusts whatever key a host first presents
    # (its default is accept-new), which would drop the pinning you already
    # have on the host. Mounted read-write so new hosts still get appended.
    # `make docker-up` and the devcontainer create the file first if the host
    # has never used ssh, so this only bites when driving compose by hand.
    - type: bind
      source: ${HOME}/.ssh/known_hosts
      target: /home/deploy/.ssh/known_hosts
      bind:
        create_host_path: false
  environment:
    DISABLE_SPRING: "1"
    # Set here rather than in the entrypoint so that exec'd shells
    # (make devcontainer-shell) get it too, not just the container's main process.
    SSH_AUTH_SOCK: "/tmp/ssh-agent.sock"
    ELASTICSEARCH_URL: "http://elasticsearch:9200"
    # FIXME: Pass url for mitmdump2
    MYSQL_HOST: "mysql"
    MYSQL_USER: "root"
    REDIS_URL: "redis://redis:6379"
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set, preferably in the .env file}
  networks:
    - network

services:
  web:
    <<: *ruby-service 
    ports:
      # Always expose on host! (use override to expose anything else)
      - "3000:3000"
    depends_on:
      elasticsearch:
        condition: service_healthy
      # mailcatcher:
      #   condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    tty: true
    #    command: "bin/dev"
    command: bin/rails server -p 3000 -b '0.0.0.0'

  worker:
    <<: *ruby-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started  # avoid race condition on bundle install
    command: bundle exec sidekiq -C config/sidekiq.yml

  faye:
    <<: *ruby-service
    ports:
      - "9292"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started  # avoid race condition on bundle install
    command: bundle exec dotenv rackup sync.ru -E production

  # NOTE - copy docker-compose.override.yml-example to docker-compose.override.yml if you want
  # fixed rather than random ports on the host for services below

#  mailcatcher:
#    build:
#      context: .
#      dockerfile: Dockerfile.mailcatcher
#    ports:
#      - "31080:1080"

  # The proxy path this container serves is switched off in production
  # (Morph::Runner passes disable_proxy: true unconditionally - see issue #1506),
  # and the image is amd64-only, so it is behind a profile rather than being a
  # startup dependency of the development environment.
  # Start it with: docker compose --profile proxy up
  mitmdump2:
    image: openaustralia/morph-mitmdump
    profiles:
      - proxy
    ports:
      - "8080"
    network_mode: host
    environment:
      MORPH_URL: http://web:3000
      MITMPROXY_SECRET: ${MITMPROXY_SECRET:?MITMPROXY_SECRET must be set, preferably in the .env file}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      start_period: 2s
      interval: 1s
      timeout: 10s
      retries: 120

      
volumes:
  gem_cache:

